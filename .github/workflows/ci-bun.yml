# CI reutilizable para proyectos Bun: install + check en cada pull request.
# Fuente: lucasramosuy/brand — cada proyecto lo llama con `uses:`.
name: CI Bun (reutilizable)

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
